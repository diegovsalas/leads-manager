<style>
/* Archivo auto-hospedada — ver static/fonts/OFL.txt */
@font-face{font-family:'Archivo';src:url('/static/fonts/archivo-var.woff2') format('woff2-variations');font-weight:100 900;font-style:normal;font-display:swap;}
/* Paleta de static/css/avantex-tokens.css (modo claro) */
:root{
  --navy:#0C1F3E; --blue:#0954E6; --blue-hover:#0743B8; --blue-ink:#0743B8; --blue-soft:#E8EFFD;
  --bg:#F4F7FB; --bg-hover:#EDF1F8; --border:#DBE4F0; --border-strong:#C5D3E8; --border-subtle:#E9EFF7;
  --ink-1:#0C1F3E; --ink-2:#5B6D8C; --ink-3:#637594;
  --ok:#1D7A4C; --ok-soft:#DCF0E5; --danger-soft:#FBE6E3; --danger-ink:#9A2E22;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink-1);min-height:100vh;padding:24px 16px;-webkit-font-smoothing:antialiased}
@media (max-width:480px){body{padding:0;background:#fff}}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;max-width:560px;margin:0 auto;overflow:hidden}
@media (max-width:480px){.card{border:0;border-radius:0}}
.hero{background:var(--navy);color:#fff;padding:26px 20px 22px;border-bottom:4px solid var(--blue)}
.hero img{height:20px;width:auto;margin-bottom:18px;display:block}
.hero h1{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px}
.hero p{font-size:14px;line-height:1.5;color:#A9BDE4}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--border-strong);border-radius:10px;font-size:16px;font-family:inherit;color:var(--ink-1);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.field textarea{min-height:110px;resize:vertical;line-height:1.45}
::placeholder{color:#97A6BE}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.4}
.opt-tag{font-weight:400;color:var(--ink-3)}
.alert{background:var(--danger-soft);color:var(--danger-ink);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.4;margin:16px 20px 0}
.bar .alert{margin:0 0 10px}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-size:16px;font-weight:650;text-align:center;text-decoration:none;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--blue-hover)}
.btn:disabled{opacity:.65;cursor:default}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.fine{font-size:12px;color:var(--ink-3);text-align:center;margin-top:10px}
</style>
